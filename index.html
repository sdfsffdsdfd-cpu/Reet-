<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Reet</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: #0d0d13; color: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow-x: hidden; position: relative; }
        .stars { position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #0d0d13 100%); }
        .heart-bg { position: absolute; font-size: 20px; color: rgba(239, 68, 68, 0.15); animation: float 6s infinite linear; pointer-events: none; }
        @keyframes float { 0% { transform: translateY(100vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; } }
        .card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(12px); border-radius: 24px; padding: 40px 30px; width: 90%; max-width: 480px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.4); z-index: 10; }
        h1 { font-size: 2.2rem; color: #f43f5e; margin-bottom: 20px; font-weight: 700; letter-spacing: -0.5px; opacity: 0; transition: opacity 1s ease; }
        .heart-icon { font-size: 45px; color: #f43f5e; margin-bottom: 15px; animation: pulse 1.5s infinite; display: inline-block; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
        p { font-size: 1.05rem; line-height: 1.7; color: #d1d5db; margin-bottom: 20px; text-align: justify; min-height: 120px; }
        .cursor { border-right: 2px solid #f43f5e; animation: blink 0.75s step-end infinite; }
        @keyframes blink { from, to { border-color: transparent } 50% { border-color: #f43f5e; } }
        .signature { font-style: italic; color: #9ca3af; text-align: right; margin-top: 25px; font-size: 1.1rem; opacity: 0; transition: opacity 1s ease; }
        .signature span { color: #f43f5e; font-weight: 600; }
    </style>
</head>
<body>
    <div class="stars"></div>
    <div class="card">
        <div class="heart-icon">❤️</div>
        <h1 id="heading">To My Dearest Reet,</h1>
        <p><span id="text-target"></span><span id="cursor-element" class="cursor"></span></p>
        <div id="sig" class="signature">Forever yours, <br><span>Saumojit</span></div>
    </div>
    <script>
        // Floating hearts background logic
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-bg');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 4 + 's';
            heart.style.fontSize = Math.random() * 15 + 10 + 'px';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 7000);
        }
        setInterval(createHeart, 400);

        // One-by-one typewriter logic
        const message = "Sometimes I struggle to find the right words, and I deeply apologize for the times I fail to ask how you are feeling or hold you close when you are enduring painful period cramps. Please know it is never because I don't care. My heart aches to think you ever feel alone in those moments. You mean absolutely everything to me, and I am learning to be the comforting, attentive partner you truly deserve. My love for you grows deeper every single day.";
        let index = 0;
        const target = document.getElementById('text-target');
        const heading = document.getElementById('heading');
        const sig = document.getElementById('sig');
        const cursor = document.getElementById('cursor-element');

        function typeEffect() {
            if (index === 0) { heading.style.opacity = '1'; }
            if (index < message.length) {
                target.textContent += message.charAt(index);
                index++;
                setTimeout(typeEffect, 45); // Adjust typing speed here (lower = faster)
            } else {
                sig.style.opacity = '1';
                cursor.style.display = 'none'; // Hide cursor when finished
            }
        }
        
        // Start typing shortly after page loads
        window.onload = () => setTimeout(typeEffect, 800);
    </script>
</body>
</html>
